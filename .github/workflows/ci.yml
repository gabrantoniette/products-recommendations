name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only token for every job
permissions:
  contents: read

# Cancel outdated runs of the same pull request, but let every run on main finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # There are no tests yet, so this job is not called Test. It checks what
  # can be checked without them: the lockfile installs, the packages are
  # signed, every module parses and every data file is valid JSON.
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      # Fails if any dependency has an install script that is not approved in package.json (allowScripts)
      - name: Install dependencies
        run: npm ci --strict-allow-scripts

      - name: Verify dependency signatures
        run: npm audit signatures

      # package.json sets "type": "module", so each file is parsed as the browser loads it
      - name: Check JavaScript syntax
        run: git ls-files '*.js' | xargs -n1 node --check

      - name: Check JSON data
        run: |
          git ls-files '*.json' ':!package-lock.json' | xargs -n1 \
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fails if the pull request adds or updates a dependency with a known vulnerability
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
